# CI for every PR to dev/main and every push to dev (TC-26).
# Jobs only call tools/ci/run.py so the same checks run locally; see tools/ci/README.md.
name: CI

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: checks (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      CI_RUN: uv run --no-project python tools/ci/run.py
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Set up uv (Python from .python-version)
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Set up pnpm (version from package.json packageManager)
        uses: pnpm/action-setup@v4

      - name: Set up Node.js (version from .nvmrc)
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        id: install
        run: $CI_RUN install

      # Once installed, every check runs even if an earlier one failed, so one push shows all failures.
      - name: Lint
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: $CI_RUN lint

      - name: Type-check
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: $CI_RUN typecheck

      - name: Unit tests
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: $CI_RUN test

      - name: Build
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: $CI_RUN build

      - name: Contract drift and import boundaries
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: $CI_RUN hooks

      # Backend logs written by the API suite (tests/api) and anything else pytest left in its temp dirs.
      - name: Upload test logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs-${{ matrix.os }}
          path: .ci-tmp/pytest/**/*.log
          if-no-files-found: ignore
          retention-days: 14

  # TC-29: the QA end-to-end suite launches the real desktop app (Playwright drives Electron). It needs the built
  # UI and shell, and a display: Linux gets one from xvfb. Kept apart from `checks` so a slow or flaky UI run
  # never hides the fast results; its traces, screenshots and logs are uploaded when it fails.
  e2e:
    name: e2e (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      CI_RUN: uv run --no-project python tools/ci/run.py
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Set up uv (Python from .python-version)
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Set up pnpm (version from package.json packageManager)
        uses: pnpm/action-setup@v4

      - name: Set up Node.js (version from .nvmrc)
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: $CI_RUN install

      - name: Build the UI and the desktop shell
        run: $CI_RUN build

      - name: End-to-end tests (Windows)
        if: runner.os == 'Windows'
        run: $CI_RUN e2e

      # Chromium's sandbox needs a SUID helper that CI containers lack; the flag only affects the Electron
      # process under test, the renderer stays sandboxed (apps/desktop/README.md).
      - name: End-to-end tests (Linux, under xvfb)
        if: runner.os == 'Linux'
        env:
          STUDIO_E2E_NO_SANDBOX: '1'
        run: xvfb-run --auto-servernum $CI_RUN e2e

      - name: Upload e2e report and logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-report-${{ matrix.os }}
          path: |
            tests/e2e/test-results
            tests/e2e/playwright-report
          if-no-files-found: ignore
          retention-days: 14
