[project]
name = "studio-backend"
version = "0.1.0"
description = "FastAPI service: training orchestration and file-system access for the studio."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
# Owner decision: no torch, rlgym or rlgym-learn here, ever (see packages/rlgym-adapter and ADR-0004).
# tests/test_dependencies.py enforces it.
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.32",
  # uvicorn has no WebSocket implementation of its own: without this, /ws answers as plain HTTP (TC-20).
  "websockets>=13",
]

[project.scripts]
studio-backend = "studio_backend.__main__:main"
export-openapi = "studio_backend.openapi:main"

[dependency-groups]
dev = [
  "httpx>=0.27",
  "httpx2>=2.16.0",
  "mypy>=1.13",
  "pytest>=8.3",
  "ruff>=0.8",
]

[build-system]
requires = ["uv_build>=0.13,<0.14"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "S", "C4", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
# assert is how pytest works; subprocess use in tests is deliberate.
"tests/**" = ["S101", "S603"]

[tool.mypy]
strict = true
python_version = "3.12"
files = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-markers"]
